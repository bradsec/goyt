version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - unconvert
    - unused
  settings:
    lll:
      line-length: 120
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - gocyclo
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - goyt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
