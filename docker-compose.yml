services:
  goyt:
    # Pre-built multi-arch image published on each release. Pin a version by
    # replacing `latest` with a CalVer tag, e.g. ghcr.io/bradsec/goyt:2026.08.29.
    image: ghcr.io/bradsec/goyt:latest
    # To build locally instead of pulling, comment the image line above and
    # uncomment this block (VERSION overrides the stamped version; unset falls
    # back to the package.json version):
    # build:
    #   context: .
    #   args:
    #     VERSION: ${VERSION:-}
    container_name: goyt
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GOYT_BIND: 0.0.0.0
      GOYT_PORT: 3000
      # Set a web UI password (enables the login gate). Leave unset for none.
      # WEBUI_PASSWORD: changeme
    volumes:
      # Saved downloads on the host.
      - ./downloads:/app/downloads
      # Persist the auto-downloaded yt-dlp binary across container recreates.
      - ytdlp:/app/assets/yt-dlp

volumes:
  ytdlp:
