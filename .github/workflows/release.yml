name: Release

on:
  push:
    tags:
      # CalVer tags: YYYY.MM.DD (also matches optional .N same-day suffix)
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Compiles Tailwind CSS and copies fonts into the embedded assets so the
      # binary ships the current UI even if the committed CSS is stale.
      - name: Build frontend assets
        run: |
          npm ci
          npm run build-assets

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          REF_NAME: ${{ github.ref_name }}
        run: go build -ldflags="-s -w -X goyt/internal/api.Version=${REF_NAME}" -o "goyt-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/goyt

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: goyt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: goyt-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  # A single release job publishes all binaries and generates the notes once.
  # Previously the publish step ran in every matrix job, so each one appended
  # auto-generated notes and the changelog line was duplicated.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Build and push the container image to GitHub Container Registry so users can
  # `docker run ghcr.io/bradsec/goyt` without a local toolchain build. Tagged
  # with the CalVer git tag and `latest`. arm64 builds under QEMU emulation;
  # the gha cache keeps repeat runs reasonable.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
